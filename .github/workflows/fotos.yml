name: Buscar fotos genericas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["herramientas/temas_fotos.json"]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 herramientas/buscar_fotos.py
      - run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add banco
          git diff --cached --quiet || (git commit -m "Banco de fotos genericas [skip ci]" && git pull --rebase && git push)
