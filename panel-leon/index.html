.grid{display:flex;flex-direction:column;gap:14px;max-width:780px;margin:0 auto}

.cobx{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13px;line-height:1.45}.cobx.bad{background:var(--red50);border:2px solid var(--red);color:#5a1414}.cobx.warn{background:var(--amber50);border:1px solid var(--amber)}.cobx.ok{background:var(--g50,#eef8f2)}.cobx ol{margin:6px 0 6px 18px;padding:0}.p-a{background:var(--amber50);color:var(--amber)}.p-n{background:#eef1f0;color:var(--muted)}

const IVA=0.19;
const S={all:[],tab:'Licitación',view:'activas',det:{},open:null,chat:{},kpi:'abiertas',saved:{},tm:{},fichaCarga:{},cot:{},cjob:null,cjobT:0,tqPedido:{}};

const trimR=r=>(r||'').trim()||'Sin región';
const ls={get(k,d){try{const v=localStorage.getItem('leon51:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('leon51:'+k,JSON.stringify(v))}catch(e){}}};
function cierre(f){
  if(!f)return{txt:'Cierre no informado',cls:'p-n',ms:null};
  const ms=new Date(f)-Date.now();
  if(ms<=0)return{txt:'Cerrada',cls:'p-n',ms};
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);
  return{txt:'Cierra en '+(d?d+'d ':'')+h+'h',cls:ms<3*864e5?'p-r':ms<7*864e5?'p-a':'p-g',ms};
}
const fecha=f=>f?new Date(f).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'No informada';
const urlMP=o=>o.tipo_compra==='Compra Ágil'?'https://buscador.mercadopublico.cl/ficha?code='+encodeURIComponent(o.codigo):'https://www.mercadopublico.cl/Procurement/Modules/RFB/DetailsAcquisition.aspx?idlicitacion='+encodeURIComponent(o.codigo);
/* v14.9: ⭐ puntaje de oportunidad = qué tan de tu rubro es (match) × cuánta plata hay en juego (monto).
   El monto se mide en escala logarítmica y por tipo: en Compra Ágil 200 mil → 0 y 8 millones → 100; en licitación 2 millones → 0 y 1.000 millones → 100.
   Media geométrica: para salir arriba tiene que ser de tu rubro Y tener monto alto. Sin monto publicado cuenta como 30 (no se entierra). */
function opMontoPts(o){const m=maximo(o)?.v||0;if(!m)return 30;const [a,b]=o.tipo_compra==='Compra Ágil'?[2e5,8e6]:[2e6,1e9];
  return Math.max(0,Math.min(100,Math.round(100*(Math.log10(m)-Math.log10(a))/(Math.log10(b)-Math.log10(a)))))}
// "bomba" de otro rubro (médica, forestal, calefacción, aire acondicionado…) no es tu rubro: su match vale un cuarto
const OP_FUERA=/(aspiraci[oó]n|secreci|nebuliz|elastom|infusi[oó]n|insulina|\bcadd\b|jeringa|m[eé]dic|cl[ií]nic|espalda|forestal|fumiga|calefac|termo el[eé]ctric|[oó]leo el|aire acondicionado|climatiz|combustible|bencina|vac[ií]o|bicicleta|inflar|catering|discos duros)/i;
const OP_RUBRO=/(aguas servidas|planta de tratamiento|\bptas?\b|\bpeas\b|alcantarill|fosa|cloro|hipoclorito|bacteria|agua potable|\bapr\b|\bssr\b|pozo|elevadora|sala de bombas|hidropack|hidroneum|sumergible|electrobomba|dosificador|lixiviad)/i;
const opFuera=o=>OP_FUERA.test(o.titulo||'')&&!OP_RUBRO.test(o.titulo||'');
function opScore(o){const mt=Math.max(0,Math.min(100,+o.match||0))*(opFuera(o)?.25:1);return Math.round(Math.sqrt(mt*Math.max(opMontoPts(o),3)))}
function maximo(o){
  if(o.monto_maximo_licitacion)return{v:+o.monto_maximo_licitacion,src:o.monto_maximo_fuente||'Bases (IA)',tipo:o.monto_maximo_tipo||'no_indicado',ver:o.monto_maximo_verificado};
  if(o.precio_tope_bases)return{v:+o.precio_tope_bases,src:o.precio_tope_fuente||'Bases',tipo:'no_indicado',ver:true};

  return null;
}

    {const loc=ls.get('interes',{}),pend={},porCod=new Map(S.all.map(o=>[o.codigo,o]));

function filtered(){

        mm=+$('#fMatch').value,mo=+$('#fMonto').value,rub=$('#fRubro').checked,ord=$('#fOrden').value;

async function historial(o){

function calc(o,det){
  const it=itemsDe(o,det),pr=ls.get('precios:'+o.codigo,{}),cs=ls.get('costos:'+o.codigo,{});
  // Oferta = productos + flete (cobrado al cliente) ; IVA 19% sobre todo. En Mercado Público el flete va dentro del precio unitario.
  const prod=it.reduce((s,x,i)=>s+(+pr[i]||0)*x.q,0),flete=+ls.get('flete:'+o.codigo,0)||0;
  const mp=it.map((x,i)=>{const v=+pr[i]||0;return v?Math.round(v+(prod&&flete?flete*(v*x.q/prod)/x.q:0)):0});
  const neto=flete&&prod?mp.reduce((s,v,i)=>s+v*it[i].q,0):prod,iva=Math.round(neto*IVA),total=neto+iva;
  const costoProd=it.reduce((s,x,i)=>s+(+cs[i]||0)*x.q,0),costo=costoProd+flete,util=neto-costo,conCosto=it.some((x,i)=>+cs[i]>0);
  const mx=maximo(o);let cmp=null;
  if(mx&&neto){const base=mx.tipo==='neto'?neto:total;cmp={base,dif:mx.v-base,pct:(base/mx.v)*100,lado:mx.tipo==='neto'?'neto':'total con IVA'}}
  return{it,pr,prod,flete,mp,neto,iva,total,mx,cmp,costoProd,costo,util,conCosto,cs};
}

async function pdfTexto(f){
  if(!window.pdfjsLib){await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('no se pudo cargar el lector de PDF'));document.head.appendChild(sc)});

  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,4);i++){const c=await (await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+' '}

async function subirComprobante(o,f){

    const info={archivo_nombre:f.name,fuente:'comprobante'};
    if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){
      const t=await pdfTexto(f),n=v=>+String(v).replace(/\D/g,'');
      const m=t.match(/Monto total ofertado\s*\$?\s*([\d.]+)/i),fe=t.match(/Fecha y hora de env[ií]o\s*(\d{2})-(\d{2})-(\d{4})\s*a las\s*(\d{1,2}):(\d{2})/i),rs=t.match(/Responsable de la cotizaci[oó]n\s*(.+?)\s*Convocatoria/i),pq=t.match(/Cantidad de productos ofertados\s*(\d+)/i);
      const cods=t.match(/\d{3,8}-\d{1,5}-[A-Z0-9]{3,6}/g)||[];
      if(cods.length&&!cods.includes(o.codigo)&&!confirm(`El comprobante es de ${cods[0]}, no de ${o.codigo}. ¿Guardarlo igual?`)){S.compJob=null;drawer();return}
      if(m)info.monto_total=n(m[1]);if(fe)info.fecha_envio=`${fe[3]}-${fe[2]}-${fe[1]}T${fe[4].padStart(2,'0')}:${fe[5]}:00-03:00`;if(rs)info.responsable=rs[1].trim();if(pq)info.productos=+pq[1];

    const r=await fetch(`${SB}/storage/v1/object/documentos/${encodeURIComponent(path)}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+await tok(),'Content-Type':f.type||'application/octet-stream'},body:f});

    info.archivo_path=path;
    await marcarEnviada(o,true,info);
    S.resUna[o.codigo]=info.monto_total?`✓ Comprobante guardado: ${clp(info.monto_total)}${info.fecha_envio?' · enviado '+fecha(info.fecha_envio):''}`:'✓ Comprobante guardado';

const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function progHTML(o){
  const j=S.job;if(!j||j.cod!==o.codigo)return '';
  const t=(Date.now()-j.t0)/1000;
  let pct,rest,lento=false;
  if(j.etapa==='abriendo'){pct=Math.min(8,2+t);rest=null}
  else if(j.etapa==='guardando'){pct=97;rest=2}
  else{const ti=(Date.now()-j.t1)/1000,f=1-Math.exp(-ti/(j.est*0.55));
    if(j.de){const bloque=88/j.de*(j.etapa==='uniendo'?0:1);pct=j.etapa==='uniendo'?90+6*f:8+88*j.n/j.de+bloque*f*(j.det?Math.min(2,j.det.split(' + ').length):1);pct=Math.min(pct,96)}
    else pct=8+87*f;
    rest=Math.max(0,j.est-ti);lento=ti>j.est*1.15}
  const txt={abriendo:'Abriendo archivos',enviando:j.de?`La IA está leyendo las bases · documento ${Math.min(j.n+1,j.de)}${j.det&&j.det.includes(' + ')?' y '+Math.min(j.n+2,j.de):''} de ${j.de}`:'La IA está leyendo las bases',uniendo:'Juntando lo que encontró en todos los documentos',guardando:'Guardando resultados'}[j.etapa];
  return `<div class="prog ${lento?'lento':''}" id="prog"><div class="pt"><span>⏳ ${txt}…</span><span>${mmss(t)}</span></div>
    <div class="pbar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="ps">${lento?'Está tardando más de lo normal: Google puede estar ocupado y se reintenta solo. No cierres esta ventana.':rest==null?'Preparando documentos…':(j.de&&j.etapa==='enviando'?'Este par: aprox. ':'Faltan aprox. ')+(rest<60?Math.ceil(rest/5)*5+' s':mmss(rest)+' min')+(j.det?' · '+esc(j.det):'')}</div></div>`;
}

function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const relev=n=>/bases|anexo|t[eé]cnic|administrativ|requerimiento|especificaci|formulario|pauta|tdr|t[eé]rminos/i.test(n)?1:0;
async function extraerBases(files,st){
  const out={pdfs:[],textos:[],omitidos:[]};
  async function proc(nombre,getBuf,nivel){
    const e=ext(nombre);
    if(/^(__macosx|\.)/i.test(nombre.split('/').pop())||nombre.includes('__MACOSX'))return;
    if(e==='zip'&&nivel<2){await lib('zip');const z=await JSZip.loadAsync(await getBuf());
      for(const f of Object.values(z.files)){if(f.dir)continue;await proc(f.name,()=>f.async('arraybuffer'),nivel+1)}return}
    if(e==='pdf'){const buf=await getBuf();out.pdfs.push({nombre:nombre.split('/').pop(),buf,size:buf.byteLength});return}
    if(e==='jpg'||e==='jpeg'||e==='png'){const buf=await getBuf();if(buf.byteLength>4e6){out.omitidos.push(nombre.split('/').pop()+' (imagen de más de 4 MB)');return}out.pdfs.push({nombre:nombre.split('/').pop(),buf,size:buf.byteLength,mime:e==='png'?'image/png':'image/jpeg'});return}
    if(e==='docx'){await lib('docx');const r=await mammoth.extractRawText({arrayBuffer:await getBuf()});if(r.value.trim())out.textos.push({nombre:nombre.split('/').pop(),texto:r.value});return}
    if(e==='xlsx'||e==='xls'||e==='ods'){await lib('xlsx');const wb=XLSX.read(await getBuf(),{type:'array'});
      const t=wb.SheetNames.map(s=>'--- Hoja: '+s+' ---\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n');if(t.trim())out.textos.push({nombre:nombre.split('/').pop(),texto:t});return}
    if(e==='doc'){const r=await fn('doc-texto',{nombre:nombre.split('/').pop(),base64:b64(await getBuf())});if(r&&r.texto&&r.texto.trim())out.textos.push({nombre:nombre.split('/').pop(),texto:r.texto});else out.omitidos.push(nombre.split('/').pop()+' (Word vacío)');return}
    if(e==='rtf'){const t=new TextDecoder('latin1').decode(await getBuf()).replace(/\\par[d]?/g,'\n').replace(/\\'([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,'');if(t.trim())out.textos.push({nombre:nombre.split('/').pop(),texto:t});return}
    if(e==='txt'||e==='csv'){out.textos.push({nombre:nombre.split('/').pop(),texto:new TextDecoder().decode(await getBuf())});return}
    out.omitidos.push(nombre.split('/').pop());
  }
  for(const f of files){st.textContent='Abriendo '+f.name+'…';await proc(f.name,()=>f.arrayBuffer(),0)}
  // Se leen por lotes de a 2 documentos, así que ya no hay tope total chico: solo por archivo (≈12 MB) y hasta 40 documentos
  out.pdfs.sort((a,b)=>relev(b.nombre)-relev(a.nombre)||a.size-b.size);
  const sel=[];
  // v14.2: los PDF pesados (más de 9 MB) se parten por páginas para que la IA los lea completos
  const PART=8.5e6,partes=[];
  for(const p of out.pdfs){
    if(p.mime||p.size<=PART){partes.push(p);continue}
    try{st.textContent='Partiendo '+p.nombre+' ('+(p.size/1e6).toFixed(0)+' MB) para leerlo completo…';await lib('pdflib');
      const src=await PDFLib.PDFDocument.load(p.buf,{ignoreEncryption:true}),n=src.getPageCount(),por=Math.max(1,Math.floor(n*PART/p.size));
      for(let i=0;i<n;i+=por){const d=await PDFLib.PDFDocument.create();const pg=await d.copyPages(src,[...Array(Math.min(por,n-i)).keys()].map(k=>i+k));pg.forEach(x=>d.addPage(x));
        const u=await d.save();const nm=p.nombre.replace(/\.pdf$/i,'')+' (págs '+(i+1)+'-'+Math.min(n,i+por)+').pdf';
        if(u.byteLength>12e6)out.omitidos.push(nm+' (páginas muy pesadas)');else partes.push({nombre:nm,buf:u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength),size:u.byteLength})}
    }catch(e){out.omitidos.push(p.nombre+' (PDF de '+(p.size/1e6).toFixed(0)+' MB que no se pudo partir)')}
  }
  out.pdfs=partes;
  for(const p of out.pdfs){if(p.size>12e6)out.omitidos.push(p.nombre+' (más de 12 MB)');else if(sel.length>=40)out.omitidos.push(p.nombre+' (sobre 40 documentos)');else sel.push({nombre:p.nombre,base64:b64(p.buf),size:p.size,mime:p.mime})}
  out.pdfs=sel;
  out.textos=out.textos.slice(0,40).map(t=>({nombre:t.nombre,texto:t.texto.slice(0,200000)}));
  return out;
}

// Arma lotes de a 2 documentos (o 1 si es pesado), los más relevantes primero
function armarLotes(x){
  const docs=[...x.pdfs.map(p=>({...p,tipo:'pdf',peso:p.size})),...x.textos.map(t=>({...t,tipo:'txt',peso:t.texto.length*2}))]
    .sort((a,b)=>relev(b.nombre)-relev(a.nombre));
  const L=[];let cur=[];
  for(const d of docs){
    if(cur.length&&(cur.length>=2||cur.reduce((s,y)=>s+y.peso,0)+d.peso>8e6)){L.push(cur);cur=[]}
    cur.push(d);
  }
  if(cur.length)L.push(cur);
  return L;
}
const cuerpoLote=l=>({archivos:l.filter(d=>d.tipo==='pdf').map(d=>({nombre:d.nombre,base64:d.base64,...(d.mime?{mime:d.mime}:{})})),textos:l.filter(d=>d.tipo==='txt').map(d=>({nombre:d.nombre,texto:d.texto}))});
const estLote=l=>Math.min(130,Math.round(15+l.reduce((s,d)=>s+(d.tipo==='pdf'?9*d.peso/1e6:2*d.peso/1e5),0)));

function agregarBandeja(fs){const o=S.all.find(x=>x.codigo===S.open);if(!o||!fs.length)return;const B=S.bandeja[o.codigo]||(S.bandeja[o.codigo]=[]);

async function subirBases(files){
  const o=S.all.find(x=>x.codigo===S.open),st=$('#pdfst');if(!files.length)return;
  if(S.job){st.textContent='Ya hay un análisis en curso, espera que termine.';return}
  S.job={cod:o.codigo,t0:Date.now(),etapa:'abriendo'};drawer();
  const fin=()=>{S.job=null;if(S.open===o.codigo)drawer()};
  let x;
  try{x=await extraerBases([...files],$('#pdfst')||st)}catch(e){fin();const s=$('#pdfst');if(s)s.textContent='No pude abrir los archivos: '+e.message;return}
  if(!x.pdfs.length&&!x.textos.length){fin();const st=$('#pdfst');st.textContent='No encontré PDF, Word ni Excel para leer.'+(x.omitidos.length?' Omitidos: '+x.omitidos.join(', '):'');return}
  {const s0=$('#pdfst');if(s0)s0.textContent='';}
  const cola=armarLotes(x),total=cola.reduce((s,l)=>s+l.length,0),parciales=[],motores=[],leidos=[],fallidos=[];
  let hechos=0;
  const nom=l=>l.map(d=>d.nombre).join(' + ');
  // lee un lote; si se demora demasiado y trae 2 documentos, los separa y los lee de a uno
  while(cola.length){
    const l=cola.shift();
    Object.assign(S.job,{etapa:'enviando',t1:Date.now(),est:estLote(l),n:hechos,de:total,det:nom(l)});
    let ok=false,ult='';
    for(let intento=0;intento<2&&!ok;intento++){
      try{const r=await fn('lia-bases',{codigo:o.codigo,modo:'lote',lote:{n:hechos+1,de:total},...cuerpoLote(l)});
        parciales.push(r.analisis);motores.push(r.motor);leidos.push(...l.map(d=>({nombre:d.nombre,tipo:d.tipo})));ok=true}
      catch(e){ult=e.message;if(/sesi[oó]n/i.test(ult))break;
        if(l.length>1&&/546|504|tiempo|TIEMPO|alcanz/i.test(ult)){cola.unshift(...l.map(d=>[d]));ult='dividido';break}
        await new Promise(r=>setTimeout(r,4000))}
    }
    if(/sesi[oó]n/i.test(ult)){fin();const s=$('#pdfst');if(s)s.innerHTML='<span style="color:var(--red)">⚠ '+esc(ult)+'</span>';return}
    if(ult==='dividido')continue;
    if(!ok)fallidos.push(nom(l)+' ('+ult.slice(0,80)+')');
    hechos+=l.length;
  }
  if(!parciales.length){fin();const s=$('#pdfst');if(s)s.innerHTML='<span style="color:var(--red)">⚠ No se pudo leer ningún documento. '+esc(fallidos.join(' · '))+'</span>';return}
  Object.assign(S.job,{etapa:'uniendo',t1:Date.now(),est:30,n:total,de:total,det:parciales.length+' lote'+(parciales.length>1?'s':'')+' leído'+(parciales.length>1?'s':'')});
  try{await fn('lia-bases',{codigo:o.codigo,modo:'unir',parciales,motores,nombres:leidos,no_leidos:[...x.omitidos,...fallidos]});
    S.job.etapa='guardando';
    S.det[o.codigo]=await rpc('get_oportunidad_detalle',{p_codigo:o.codigo});
    const d=await rpc('get_dashboard_mp_v2');const n=(d.oportunidades||[]).find(y=>y.codigo===o.codigo);if(n)Object.assign(o,n,{region:trimR(n.region)});
    S.tqPedido[o.codigo]=false;ls.set('terms:'+o.codigo,{});pedirTerminos(o);
    const seg=Math.round((Date.now()-S.job.t0)/1000);fin();const s2=$('#pdfst');
    if(s2)s2.innerHTML='✓ Leídos '+leidos.length+' de '+total+' documentos en '+mmss(seg)+' min'+
      (fallidos.length?'<br><span style="color:var(--red)">⚠ Sin leer: '+esc(fallidos.join(' · '))+'. Para incluirlo, vuelve a cargar todos los documentos juntos (si cargas solo ese, reemplaza el análisis).</span>':'')+
      (x.omitidos.length?'<br><span style="color:var(--amber)">Omitidos: '+esc(x.omitidos.join(', '))+'</span>':'');
  }catch(e){fin();const s=$('#pdfst');if(s)s.innerHTML='<span style="color:var(--red)">⚠ '+esc(e.message)+'</span>'}
}

function syncLine(nom,r){

  if(r.error)return `<div class="sl"><span>${nom}</span><b style="color:var(--red)">⚠ ${esc(r.error)}</b></div>`;
  if(r.cached)return `<div class="sl"><span>${nom}</span><b style="color:var(--g700)">✓ ya actualizado hace ${r.minutos??'<15'} min</b></div>`;
  return `<div class="sl"><span>${nom}</span><b style="color:var(--g700)">✓ ${r.nuevas||0} nuevas · ${r.actualizadas||0} actualizadas${r.pendientes?' · '+r.pendientes+' quedan para la próxima':''}</b></div>`;
}

function parseFecha(t){ // ISO, dd-mm-aaaa, dd/mm/aaaa, "20 de octubre de 2026"
  if(!t)return null;const s=String(t).toLowerCase();let m;
  if((m=s.match(/(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/))){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  if((m=s.match(/\b(\d{1,2})\s+de\s+([a-záéíóú]+)(?:\s+de(?:l)?\s+(\d{4}))?/))){const k=MESES.findIndex(x=>m[2].startsWith(x.slice(0,4)));if(k>=0)return `${m[3]||new Date().getFullYear()}-${String(k+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  return null;

  for(let d=1;d<=dias;d++){const f=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,E=ev.filter(e=>e.f===f);h+=`<div class="cd ${f===hoy?'hoy':''}"><span class="cn">${d}</span>${E.slice(0,4).map(e=>`<a href="#" class="ce ${e.k}" ${e.cod?`data-abrir="${esc(e.cod)}"`:`data-pg="${e.pg}"`} title="${esc(e.t)}">${e.i} ${esc(e.t)}</a>`).join('')}${E.length>4?`<span class="src">+${E.length-4} más</span>`:''}</div>`}

// en la ficha de cada oportunidad: ¿ya tengo este documento?
const tkD=s=>new Set(String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(w=>w.length>3&&!/^(anexo|declaracion|jurada|simple|documento|certificado|oferta|formulario|para|segun|bases)$/.test(w)));
function docEnBiblioteca(nombre){const D=S.G?.docs||[];if(!D.length)return null;const a=tkD(nombre);let best=null,sc=0;for(const d of D){const b=tkD(d.nombre+' '+(d.tipo||''));const i=[...a].filter(x=>b.has(x)).length;if(i>sc){sc=i;best=d}}if(sc>=1&&a.size)return best;

function pctNum(t){const m=String(t??'').match(/(\d+(?:[.,]\d+)?)\s*%?/);return m?parseFloat(m[1].replace(',','.')):null}
const OPC_CRIT=[[100,'Cumplo totalmente'],[70,'No sé / regular'],[50,'Cumplo en parte'],[0,'No cumplo']];
function puntajeHTML(o,det,K){
  const A=det?.analisis;let C=(A?.criterios_evaluacion||[]).map(c=>({n:c.criterio,w:pctNum(c.ponderacion)})).filter(c=>c.n&&c.w);
  const sinCrit=!C.length;if(sinCrit)C=[{n:'Precio',w:100}];
  const esPrecio=n=>/precio|econ[oó]mic|valor|monto|costo/i.test(n);
  const sel=ls.get('crit:'+o.codigo,{});const refG=ls.get('ref:'+o.codigo,null);
  const ref=refG??(K.mx?.v?Math.round((K.mx.tipo==='con_iva'||K.mx.tipo==='bruto'?K.mx.v/1.19:K.mx.v)*0.9):null);
  const pPrecio=ref&&K.neto?Math.min(100,ref/K.neto*100):null;
  let tw=0,ts=0,falta=false;
  const filas=C.map((c,i)=>{let sc;if(esPrecio(c.n)){sc=pPrecio;if(sc==null)falta=true}else sc=+(sel[i]??70);tw+=c.w;ts+=c.w*(sc??0);
    return `<div class="pcr"><span>${esc(c.n)} <b>${c.w}%</b></span>${esPrecio(c.n)?`<b>${sc==null?'—':Math.round(sc)+' pts'}</b>`:`<select data-crit="${i}">${OPC_CRIT.map(([v,l])=>`<option value="${v}" ${+(sel[i]??70)===v?'selected':''}>${l}</option>`).join('')}</select>`}</div>`}).join('');
  const tot=tw?ts/tw:0,cls=tot>=85?'p-g':tot>=70?'p-a':'p-r',txt=tot>=85?'Buena opción de ganar':tot>=70?'Competitiva':'Difícil';
  return `<div class="box"><div class="bh"><h3>🎯 Puntaje estimado</h3>${falta?'<span class="pill p-n">Pon tus precios</span>':`<span class="pill ${cls}">${Math.round(tot)} / 100 · ${txt}</span>`}</div>
    ${sinCrit?'<div class="src" style="margin-bottom:6px">Las bases analizadas no traen criterios de evaluación: lo calculo solo por precio.</div>':''}
    <label class="pcr"><span>Precio más bajo que esperas de la competencia (neto)</span><input id="refP" inputmode="numeric" value="${ref?Number(ref).toLocaleString('es-CL'):''}" placeholder="$"></label>
    ${filas}
    ${!falta?`<div class="pbar" style="margin-top:8px"><i style="width:${Math.round(tot)}%;background:${tot>=85?'var(--g700)':tot>=70?'var(--amber)':'var(--red)'}"></i></div>`:''}
    <div class="src" style="margin-top:6px">Precio: (más bajo esperado ÷ tu oferta) × 100. ${refG==null&&ref?'El valor sugerido es 90% del monto disponible; ajústalo con el 📜 Historial.':''} Los demás criterios los marcas tú. Es una estimación, no lo que dirá la comisión.</div></div>`;
}

async function generarAnexos(o){
  const st=$('#anxSt');S.anxJob=o.codigo;if(st)st.textContent='⏳ Redactando anexos con IA (30 a 60 s)…';
  try{
    const r=await fn('lia-anexos',{codigo:o.codigo});
    await lib('docxw');const D=window.docx;
    const P=(t,o2={})=>new D.Paragraph({children:[new D.TextRun({text:String(t??''),...o2})],spacing:{after:120}});
    const kids=[];
    (r.anexos||[]).forEach((a,i)=>{
      kids.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_1,alignment:D.AlignmentType.CENTER,children:[new D.TextRun({text:a.titulo||('Anexo '+(i+1)),bold:true})],pageBreakBefore:i>0,spacing:{after:200}}));
      kids.push(P(`${r.licitacion?.tipo||''} ${r.licitacion?.codigo||''} · ${r.licitacion?.nombre||''}`,{size:18,color:'555555'}));
      if(a.referencia)kids.push(P('Según bases: '+a.referencia,{size:18,italics:true,color:'777777'}));
      if((a.campos||[]).length)kids.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:a.campos.map(c=>new D.TableRow({children:[new D.TableCell({width:{size:35,type:D.WidthType.PERCENTAGE},children:[P(c.etiqueta,{bold:true})]}),new D.TableCell({children:[P(c.valor||'________')]})]}))}),P(''));
      (a.parrafos||[]).forEach(t=>kids.push(new D.Paragraph({children:[new D.TextRun(String(t))],alignment:D.AlignmentType.JUSTIFIED,spacing:{after:160}})));
      if(a.firma!==false){const E=r.empresa||{};kids.push(P(''),P(''),new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun('________________________________')]}),new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun({text:E.representante||'Nombre representante legal',bold:true})]}),new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun(`RUT ${E.rut_representante||'________'} · ${E.razon_social||''}`)]}),new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun(`${E.comuna||'________'}, ${new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})}`)]}))}
    });
    if(!kids.length)throw new Error('La IA no devolvió anexos');
    const doc=new D.Document({styles:{default:{document:{run:{font:'Arial',size:22}}}},sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:kids}]});
    const blob=await D.Packer.toBlob(doc);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Anexos_${o.codigo}.docx`;document.body.appendChild(a);a.click();a.remove();
    S.anx[o.codigo]={ok:true,n:(r.anexos||[]).length,faltan:r.faltan||[],notas:r.notas||[]};
  }catch(e){S.anx[o.codigo]={error:e.message}}
  S.anxJob=null;if(S.open===o.codigo)drawer();
}

async function investigar(q,meses){
  S.invQ=q;S.invM=meses;S.invJob=true;S.invErr='';S.inv=null;S.ml=null;pintarPagina();
  const t0=Date.now(),tm=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000),p=$('#invPaso'),tt=$('#invT');if(tt)tt.textContent=mmss(s);if(p)p.textContent=PASOS[Math.min(PASOS.length-1,Math.floor(s/18))]},1000);
  try{S.inv=await fn('mp-investigar',{q,meses});cargarRubros()}catch(e){S.invErr=e.message}
  clearInterval(tm);S.invJob=false;pintarPagina();if(S.inv)precioRef(S.inv);
}
async function abrirInvestigacion(id){S.invJob=true;S.inv=null;pintarPagina();try{S.inv=await fn('mp-investigar',{id:+id});S.invQ=S.inv.q;S.invM=S.inv.meses;S.ml=null;precioRef(S.inv)}catch(e){S.invErr=e.message}S.invJob=false;pintarPagina()}

async function importar(cod){

    catch(e){S.imp[cod]={error:e.message};pintarPagina();if(w)w.close();return}}

function agEmbudoAgentes(){
  const per=S.ag.embPer??30,desde=per?Date.now()-per*864e5:0,P=agP(),C=S.ag.C||[];
  const cotSet=new Set(C.filter(c=>c.prospecto_id&&c.estado!=='Borrador').map(c=>c.prospecto_id));
  const slugs=[...new Set([...S.ag.A.map(a=>a.slug),...P.map(p=>p.agente).filter(Boolean)])];
  const F=slugs.map(s=>{const L=P.filter(p=>p.agente===s&&(!desde||new Date(p.hallado_en)>=desde));
    const env=L.filter(p=>p.enviado_en).length,resp=L.filter(p=>p.respondio_en).length;
    return {s,enc:L.length,cont:L.filter(p=>p.correo||p.telefono).length,env,resp,llam:L.filter(p=>p.llamado_en).length,
      cot:L.filter(p=>['Cotizado','Cliente'].includes(p.estado)||cotSet.has(p.id)).length,cli:L.filter(p=>p.estado==='Cliente').length,tasa:env?Math.round(resp/env*100):null}}).filter(f=>f.enc);
  F.sort((a,b)=>b.cli-a.cli||b.cot-a.cot||b.resp-a.resp||b.enc-a.enc);
  const mejor=Math.max(0,...F.filter(f=>f.env>=5).map(f=>f.tasa||0));
  const T=k=>F.reduce((s,f)=>s+f[k],0);
  const fila=f=>`<tr><td><b>${esc(agNomAg(f.s))}</b>${f.env>=10&&!f.resp?' <span class="agtag Baja" title="Muchos correos y ninguna respuesta">0 respuestas</span>':''}${mejor&&f.env>=5&&f.tasa===mejor?' <span class="agtag ok">⭐ mejor tasa</span>':''}</td><td>${f.enc}</td><td>${f.cont}</td><td>${f.env}</td><td>${f.resp}${f.tasa!=null?` <span class="src">(${f.tasa}%)</span>`:''}</td><td>${f.llam}</td><td>${f.cot}</td><td>${f.cli?'<b>'+f.cli+'</b>':0}</td></tr>`;
  return `<div class="box"><div class="bh"><h3>📊 Embudo por agente</h3><span class="src">de los prospectos encontrados ${per?'en los últimos '+per+' días':'desde el inicio'}</span><span class="sp"></span>${[[7,'7 días'],[30,'30 días'],[0,'Todo']].map(([v,l])=>`<button class="btn sm ${per===v?'pri':''}" data-embper="${v}">${l}</button>`).join('')}</div>
    <div style="overflow:auto"><table class="agtb"><thead><tr><th>Agente</th><th>Encontrados</th><th>Con contacto</th><th>Correo enviado</th><th>Respondieron</th><th>Llamados</th><th>Cotizados</th><th>Clientes</th></tr></thead><tbody>${F.map(fila).join('')}
    <tr style="border-top:2px solid var(--line,#e2ebe6)"><td><b>Total</b></td><td>${T('enc')}</td><td>${T('cont')}</td><td>${T('env')}</td><td>${T('resp')}${T('env')?` <span class="src">(${Math.round(T('resp')/T('env')*100)}%)</span>`:''}</td><td>${T('llam')}</td><td>${T('cot')}</td><td>${T('cli')}</td></tr></tbody></table></div>
    <div class="src" style="margin-top:6px">Úsalo para decidir: dale más búsquedas a los agentes que traen respuestas y cotizaciones, y pausa (en su tarjeta, "activo") los que mandan muchos correos sin respuesta.</div></div>`;
}

/* v17.4: búsqueda tolerante a cómo se escribe: Chelenco = Chelenko, Vizcaya = Biscaya (k=c, z=s, v=b, ll=y, sin tildes) */
const agNrm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/qu/g,'c').replace(/k/g,'c').replace(/z/g,'s').replace(/v/g,'b').replace(/ll/g,'y');
function agBuscarLocal(q){
  const t=agNrm(q).trim(),d=String(q).replace(/\D/g,'');if(t.length<2&&d.length<4)return{P:[],C:[]};
  const pal=t.split(/\s+/).filter(w=>w&&!/^\+?\d+$/.test(w)),tel=(...ts)=>d.length>=4&&ts.some(x=>String(x||'').replace(/\D/g,'').includes(d));
  const txt=s=>pal.length&&pal.every(w=>s.includes(w));
  const P=S.ag.P.filter(p=>txt(agNrm([p.empresa,p.contacto,p.cargo,p.correo,p.web,p.comuna,p.region,p.proyecto,p.oportunidad,p.nota].join(' ')))||tel(p.telefono,p.telefono2,p.whatsapp))
    .sort((a,b)=>(b.respondio_en?1:0)-(a.respondio_en?1:0)||new Date(b.actualizado_en||b.hallado_en)-new Date(a.actualizado_en||a.hallado_en)).slice(0,25);
  const C=(S.ag.C||[]).filter(c=>txt(agNrm([c.cliente,c.contacto,c.correo,c.detalle,c.notas].join(' ')))||tel(c.telefono)).slice(0,10);
  return {P,C};
}

function pgBbnn(){const B=S.bn;if(!B.l&&!B.err)bnCargar();
  if(B.err)return `<div class="empty">⚠ ${esc(B.err)}</div>`;if(!B.l)return '<div class="empty">⏳ Cargando…</div>';
  const ahora=Date.now(),L=B.l;

  <div class="agrama" style="margin:10px 0">${tabs.map(([k,l,f])=>`<button data-bntab="${k}" class="${B.tab===k?'on':''}">${l} <b>${L.filter(f).length}</b></button>`).join('')}</div>
